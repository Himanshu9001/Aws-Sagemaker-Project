apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-k8s-monitoring
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: k8s-monitoring
    targetRevision: ^4
    helm:
      releaseName: grafana-k8s-monitoring
      valuesObject:
        cluster:
          name: my-cluster
        destinations:
          grafana-cloud-metrics:
            type: prometheus
            url: https://prometheus-prod-43-prod-ap-south-1.grafana.net./api/prom/push
            auth:
              type: basic
              username: "3222722"
              apiToken: ${GRAFANA_API_TOKEN}
          grafana-cloud-logs:
            type: loki
            url: https://logs-prod-028.grafana.net./loki/api/v1/push
            auth:
              type: basic
              username: "1607036"
              apiToken: ${GRAFANA_API_TOKEN}
        clusterMetrics:
          enabled: true
          collector: alloy-metrics
        hostMetrics:
          enabled: true
          collector: alloy-metrics
          linuxHosts:
            enabled: true
          windowsHosts:
            enabled: true
          energyMetrics:
            enabled: true
        costMetrics:
          enabled: true
          collector: alloy-metrics
        clusterEvents:
          enabled: true
          collector: alloy-singleton
        nodeLogs:
          enabled: true
          collector: alloy-logs
        podLogsViaLoki:
          enabled: true
          collector: alloy-logs
        collectors:
          alloy-metrics:
            presets:
              - clustered
              - statefulset
          alloy-singleton:
            presets:
              - singleton
          alloy-logs:
            presets:
              - filesystem-log-reader
              - daemonset
        collectorCommon:
          alloy:
            controller:
              podAnnotations:
                kubernetes.azure.com/set-kube-service-host-fqdn: "true"
            remoteConfig:
              enabled: true
              url: https://fleet-management-prod-018.grafana.net
              auth:
                type: basic
                username: "1649249"
                apiToken: ${GRAFANA_API_TOKEN}
        telemetryServices:
          kube-state-metrics:
            deploy: true
            podAnnotations:
              kubernetes.azure.com/set-kube-service-host-fqdn: "true"
          node-exporter:
            deploy: true
          windows-exporter:
            deploy: true
          opencost:
            deploy: true
            metricsSource: grafana-cloud-metrics
            opencost:
              exporter:
                defaultClusterId: my-cluster
              prometheus:
                existingSecretName: grafana-cloud-metrics-grafana-k8s-monitoring
                external:
                  url: https://prometheus-prod-43-prod-ap-south-1.grafana.net./api/prom
            podAnnotations:
              kubernetes.azure.com/set-kube-service-host-fqdn: "true"
          kepler:
            deploy: true
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
